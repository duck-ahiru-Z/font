    <title>Duck Text Generator Ultimate</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3436;
            --duck-yellow: #ffd54f; 
            --duck-beak: #ff8a65; 
            --duck-shadow: #fbc02d; 
            --accent-blue: #00cec9;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* --- アヒル (Rubber Duck Style) --- */
        .duck-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .duck-body {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 100px;
            height: 60px;
            background: var(--duck-yellow);
            border-radius: 30px 30px 50px 50px;
            box-shadow: inset -5px -5px 0 var(--duck-shadow);
        }
        .duck-tail {
            position: absolute;
            bottom: 25px;
            left: 0px;
            width: 30px;
            height: 30px;
            background: var(--duck-yellow);
            border-radius: 50%;
            box-shadow: inset -3px -3px 0 var(--duck-shadow);
            z-index: -1;
        }
        .duck-head {
            position: absolute;
            top: 5px;
            left: 35px;
            width: 65px;
            height: 65px;
            background: var(--duck-yellow);
            border-radius: 50%;
            box-shadow: inset -4px -4px 0 var(--duck-shadow);
        }
        .duck-eye {
            position: absolute;
            top: 25px;
            left: 40px;
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
            z-index: 2;
        }
        .duck-eye::after {
            content: '';
            position: absolute;
            top: 1px;
            right: 2px;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
        }
        .duck-beak {
            position: absolute;
            top: 32px;
            left: 55px;
            width: 35px;
            height: 20px;
            background: var(--duck-beak);
            border-radius: 10px 20px 20px 10px;
            transform: rotate(10deg);
            z-index: 1;
        }
        .duck-wing {
            position: absolute;
            bottom: 20px;
            left: 40px;
            width: 50px;
            height: 30px;
            background: var(--duck-yellow);
            border-radius: 50% 50% 30% 30%;
            border: 3px solid var(--duck-shadow);
            border-top: none;
            transform: rotate(-10deg);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        h1 {
            color: #2d3436;
            margin-bottom: 30px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
        }
        
        /* 入力エリア */
        .input-area {
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            position: relative;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 20px;
            padding-bottom: 30px; /* 文字数カウント用に下を空ける */
            font-size: 18px;
            border: 3px solid transparent;
            border-radius: 20px;
            resize: none;
            outline: none;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: 'JetBrains Mono', monospace;
        }
        
        textarea:focus {
            border-color: var(--duck-yellow);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        /* 文字数カウンター */
        #charCount {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 0.8rem;
            color: #888;
            font-weight: bold;
            pointer-events: none; /* 入力の邪魔にならないように */
        }

        /* 文字数オーバー時の警告色（念のため） */
        #charCount.limit-near {
            color: #e67e22;
        }
        #charCount.limit-reached {
            color: #e74c3c;
        }

        #output-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .result-card {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            backdrop-filter: blur(5px);
        }
        
        .result-card:hover {
            transform: translateY(-2px);
        }

        .text-content {
            flex: 1;
            margin-right: 15px;
            overflow: hidden;
        }

        .font-label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
            display: block;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .converted-text {
            font-size: 1.4rem;
            word-break: break-all;
            color: #333;
            /* 特殊文字用フォント設定 */
            font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols", "Meiryo", sans-serif;
            line-height: 1.4;
        }
        
        .copy-btn {
            background-color: var(--duck-yellow);
            color: #2d3436;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Zen Maru Gothic', sans-serif;
            box-shadow: 0 4px 0 #f9a825;
            transition: all 0.1s;
            min-width: 80px;
            font-size: 0.9rem;
        }
        
        .copy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #f9a825;
        }
        .copy-btn:hover {
            background-color: #ffe082;
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        @media (max-width: 600px) {
            .result-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .copy-btn {
                width: 100%;
                margin-top: 5px;
            }
        }

        const inputText = document.getElementById('inputText');
        const outputContainer = document.getElementById('output-container');
        const charCount = document.getElementById('charCount');
        const maxChars = 1000;

        // 3. 入力時のイベントリスナー
        inputText.addEventListener('input', () => {
            const text = inputText.value;
            renderResults(text);
            updateCharCount(text.length);
        });

        // 文字数カウンター更新
        function updateCharCount(length) {
            charCount.textContent = `${length} / ${maxChars}`;
            
            // 90%超えたら黄色、Maxなら赤
            charCount.className = '';
            if (length >= maxChars) {
                charCount.classList.add('limit-reached');
            } else if (length >= maxChars * 0.9) {
                charCount.classList.add('limit-near');
            }
        }

        // 結果を表示する関数
        function renderResults(text) {
            outputContainer.innerHTML = ''; 

            fontStyles.forEach(style => {
                const converted = convertText(text, style.chars, style.isReverse);
                
                const div = document.createElement('div');
                div.className = 'result-card';
                const displayCheck = converted || 'Type something...';
                
                div.innerHTML = `
                    <div class="text-content">
                        <span class="font-label">${style.name}</span>
                        <div class="converted-text">${displayCheck}</div>
                    </div>
                    <button class="copy-btn" onclick="handleCopy('${converted}')">Copy</button>
                `;
                outputContainer.appendChild(div);
            });
        }

        // 4. 文字変換ロジック
        function convertText(text, targetCharsStr, isReverse = false) {
            if(!text) return "";
            
            const targetChars = [...targetCharsStr];
            
            let result = "";
            for (const char of text) {
                const index = original.indexOf(char);
                if (index !== -1 && targetChars[index]) {
                    result += targetChars[index];
                } else {
                    result += char;
                }
            }
            
            if (isReverse) {
                return [...result].reverse().join('');
            }
            
            return result;
        }

        // コピー処理
        function handleCopy(text) {
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast("コピーしました！ Quack!");
            });
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }

        // 初回表示
        renderResults("");
    </script>
</body>

</html>
